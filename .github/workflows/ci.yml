name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Syntax (node --check)
        run: npm run check
      - name: Generated sources are up to date
        run: |
          npm run generate
          git diff --exit-code -- components/crossly/sources
      - name: Lint
        run: npm run lint
      - name: Validate component shape
        run: npm run validate
      - name: Unit tests
        run: npm test
